<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parts Inventory</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>

:root{
  --paper:#F2F4F7; --surface:#FFFFFF; --ink:#17202B; --muted:#5A6473; --line:#D7DCE3;
  --signal:#FFC629; --signal-ink:#17202B; --ok:#1E7A4C; --bad:#B3261E; --chip:#E9EDF2;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1217; --surface:#171D25; --ink:#E7EBF0; --muted:#97A1AF; --line:#29313C;
    --signal:#FFC629; --signal-ink:#17202B; --ok:#5CC48F; --bad:#FF8A80; --chip:#212833;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1217; --surface:#171D25; --ink:#E7EBF0; --muted:#97A1AF; --line:#29313C;
  --signal:#FFC629; --signal-ink:#17202B; --ok:#5CC48F; --bad:#FF8A80; --chip:#212833;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 Barlow,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}

header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font:700 2rem/1 "Barlow Condensed","Arial Narrow",sans-serif;margin:0;letter-spacing:.01em}
.totals{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.totals b{color:var(--ink);font-weight:600}

/* The scan button: a shipping label you press */
.scan{display:flex;align-items:stretch;width:100%;border:0;padding:0;cursor:pointer;background:var(--signal);color:var(--signal-ink);border-radius:6px;overflow:hidden;min-height:112px;text-align:left}
.scan .bars{width:68px;flex:none;background:
  repeating-linear-gradient(90deg,var(--signal-ink) 0 3px,transparent 3px 5px,var(--signal-ink) 5px 6px,transparent 6px 10px,var(--signal-ink) 10px 14px,transparent 14px 16px,var(--signal-ink) 16px 17px,transparent 17px 21px);
  margin:16px 0 16px 18px;opacity:.9}
.scan .txt{padding:18px 20px;display:flex;flex-direction:column;justify-content:center}
.scan strong{font:700 2.1rem/1 "Barlow Condensed","Arial Narrow",sans-serif}
.scan span{font-weight:500;margin-top:6px}
.scan:active{filter:brightness(.95)}
.scan:has(input:disabled){opacity:.6;cursor:progress}
.scan:focus-within{outline:3px solid var(--ink);outline-offset:2px}
.scan .bars,.scan .txt,.scan strong,.scan span{display:block}
.scan .txt{display:flex}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}

.controls{margin-top:12px}
.stepper{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.stepper button{width:40px;height:44px;border:0;background:none;font-size:1.3rem;cursor:pointer}
.stepper input{width:48px;text-align:center;border:0;background:none;font-weight:600;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.stepper label{padding-left:12px;color:var(--muted);font-size:.9rem;white-space:nowrap}
.manual{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.manual input{flex:1;min-width:0;border:0;background:none;padding:0 12px;height:44px}
.manual button{border:0;background:var(--chip);padding:0 16px;font-weight:600;cursor:pointer}

.result{margin-top:14px;display:none;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--muted);border-radius:6px;padding:12px}
.result.show{display:flex}
.result.ok{border-left-color:var(--ok)}
.result.bad{border-left-color:var(--bad)}
.result.busy{border-left-color:var(--signal)}
.result img{width:56px;height:56px;object-fit:cover;border-radius:4px;flex:none;background:var(--chip)}
.result .msg{flex:1;min-width:0}
.result .msg b{font-weight:600}
.result .sub{color:var(--muted);font-size:.92rem}
.result button{border:1px solid var(--line);background:none;border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:600}
.review{display:none;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--signal);border-radius:6px;padding:14px;gap:12px}
.review.show{display:grid}
.rv-top{display:flex;gap:12px;align-items:center}
.rv-top img{width:64px;height:64px;object-fit:cover;border-radius:4px;background:var(--chip);flex:none}
.rv-stock{color:var(--muted);font-weight:500}
.review > label,.review .two label{display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
.review .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.review input:not([type=number]){height:44px;border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:0 10px;color:var(--ink);font-size:1rem;width:100%}
.review .pnIn{font:700 1.35rem "Barlow Condensed","Arial Narrow",sans-serif}
.rv-hint{color:var(--bad);font-size:.9rem;margin:0}
.stepper.big{width:max-content}
.rv-act{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rv-act button{height:54px;border-radius:6px;font:700 1.4rem "Barlow Condensed","Arial Narrow",sans-serif;cursor:pointer;border:2px solid var(--ink);background:none;color:var(--ink)}
.rv-act .recv{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.rv-cancel{justify-self:center;border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px 12px}
.crop{display:none;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--signal);border-radius:6px;padding:14px;gap:12px}
.crop.show{display:grid}
.crop-stage{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:4px;overflow:hidden;cursor:crosshair}
.crop-stage img{display:block;width:100%;height:auto;pointer-events:none}
.crop-box{position:absolute;border:3px solid var(--signal);box-shadow:0 0 0 9999px rgba(0,0,0,.45);pointer-events:none}
.spinner{width:20px;height:20px;border:3px solid var(--line);border-top-color:var(--signal);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}

.listhead{display:flex;gap:10px;align-items:center;margin:32px 0 10px}
h2{font:700 1.4rem/1 "Barlow Condensed","Arial Narrow",sans-serif;margin:0;flex:1}
.search{width:min(260px,50%);height:40px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 12px}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:6px;height:40px;padding:0 12px;cursor:pointer;font-weight:600}

ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:6px}
li+li{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:10px 12px;width:100%;background:none;border:0;text-align:left;cursor:pointer}
.row .th{width:48px;height:48px;border-radius:4px;background:var(--chip);object-fit:cover;display:block}
.pn{font:700 1.25rem/1.1 "Barlow Condensed","Arial Narrow",sans-serif;overflow-wrap:anywhere}
.desc{color:var(--muted);font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qty{font:700 1.6rem/1 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums;text-align:right;min-width:3ch}
.qty small{display:block;font:500 .75rem Barlow,sans-serif;color:var(--muted)}
.detail{padding:4px 12px 16px 72px;display:grid;gap:10px}
.detail label{display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
.detail input{height:40px;border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:0 10px;color:var(--ink);font-size:1rem}
.detail .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.adj{display:flex;gap:8px;flex-wrap:wrap}
.adj button{border:1px solid var(--line);background:var(--paper);border-radius:6px;height:38px;padding:0 14px;cursor:pointer;font-weight:600}
.adj .del{margin-left:auto;color:var(--bad)}
.hist{font-size:.88rem;color:var(--muted);margin:0;padding:0}
.hist div{display:flex;justify-content:space-between;padding:3px 0;font-variant-numeric:tabular-nums}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
li.grp-m{padding:16px 12px 2px;font:700 1.3rem/1.1 "Barlow Condensed","Arial Narrow",sans-serif;background:var(--paper)}
li.grp-m:first-child{padding-top:10px}
li.grp-t{padding:2px 12px 8px;color:var(--muted);font-weight:600;font-size:.92rem;background:var(--paper);border-top:0!important}
.note{color:var(--muted);font-size:.88rem;margin-top:10px}
.hide{display:none!important}
@media (max-width:520px){
  .controls{grid-template-columns:1fr}
  .detail{padding-left:12px}
  .listhead{flex-wrap:wrap}
  .search{width:100%;order:3}
}

.setup{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--signal);border-radius:6px;padding:16px;display:grid;gap:10px}
.setup p{margin:0;color:var(--muted)}
.setup input{height:44px;border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:0 10px;color:var(--ink);font-size:1rem;width:100%}
.setup button{height:48px;border:0;border-radius:6px;background:var(--signal);color:var(--signal-ink);font:700 1.3rem "Barlow Condensed","Arial Narrow",sans-serif;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips span{color:var(--muted);font-size:.9rem}
.chips button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:600}
.rv-act button[disabled]{opacity:.6;cursor:progress}
.foot{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.9rem}
.foot label{display:flex;gap:8px;align-items:center}
.foot input{height:38px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 10px;color:var(--ink);width:160px}
.when{color:var(--muted);font-size:.88rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Parts Inventory</h1>
    <div class="totals" id="totals"></div>
  </header>

  <section class="setup hide" id="setup">
    <h2>Connect your inventory sheet</h2>
    <p>Paste the web app URL from your Google Apps Script deployment. It starts with https://script.google.com and ends in /exec.</p>
    <input id="apiIn" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
    <button type="button" id="apiBtn">Connect</button>
    <p class="rv-hint hide" id="apiErr"></p>
  </section>

  <main id="app" class="hide">
    <label class="scan" id="scanBtn">
      <span class="bars" aria-hidden="true"></span>
      <span class="txt"><strong>Scan a part</strong><span>Photo of a barcode, QR code, or part number label</span></span>
      <input type="file" id="photo" accept="image/*" capture="environment" class="vh">
    </label>

    <div class="controls">
      <form class="manual" id="manualForm">
        <input id="manualIn" placeholder="Type a part number or use a USB scanner" autocomplete="off" aria-label="Part number">
        <button type="submit">Open</button>
      </form>
    </div>

    <div class="crop" id="crop"></div>
    <div class="review" id="review"></div>
    <div class="result" id="result" role="status" aria-live="polite"></div>

    <div class="listhead">
      <h2>Inventory</h2>
      <input class="search" id="search" type="search" placeholder="Search parts" aria-label="Search parts">
      <button class="ghost" id="exportBtn" type="button">Export CSV</button>
    </div>
    <ul id="list"></ul>
    <p class="note" id="storeNote"></p>

    <div class="foot">
      <label>Your name <input id="nameIn" placeholder="Shows in the log" autocomplete="name"></label>
      <button class="ghost" id="shareBtn" type="button">Copy link for others</button>
      <button class="ghost" id="changeApi" type="button">Change sheet</button>
    </div>
  </main>
</div>

<script>
// Optional: paste the Apps Script web app URL here so nobody sees the setup screen.
const API_URL = "https://script.google.com/macros/s/AKfycbx8vf4ODQmBuS27jtdaB7-qALkL9Kr1MQ-L_VXbvlo_b1ertdkQ9RO1d23Jb_16oi7STg/exec";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").trim().replace(/\s+/g, " ");
const idFor = pn => norm(pn).toUpperCase();
const LS = {
  get: k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }
};

let api = API_URL;
{
  const m = location.hash.match(/api=([^&]+)/);
  if (m){ api = decodeURIComponent(m[1]); LS.set("partsApi", api); history.replaceState(null, "", location.pathname); }
}
if (!api) api = LS.get("partsApi");

let parts = new Map();
let openId = null, filter = "", lastUndo = null, pendingRender = false, pending = null;

/* ---------- sheet sync ---------- */
async function apiGet(url = api){
  const r = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now());
  const j = await r.json();
  if (!j.ok) throw Object.assign(new Error(j.error || "Load failed"), { server: true });
  return j;
}
async function apiPost(body){
  const r = await fetch(api, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ ...body, by: $("#nameIn").value.trim() }) });
  const j = await r.json();
  if (!j.ok) throw Object.assign(new Error(j.error || "Save failed"), { server: true });
  return j;
}
function setSync(ok){
  $("#storeNote").textContent = ok ? "Synced with the inventory Google Sheet." : "Can’t reach the inventory sheet. Check your connection. It will keep retrying.";
}
async function refresh(){
  if (!api) return;
  try {
    const j = await apiGet();
    parts = new Map(j.parts.map(p => [p.id, p]));
    setSync(true);
    requestRender();
  } catch { setSync(false); }
}

/* ---------- review card ---------- */
function datalists(){
  const opts = f => [...new Set([...parts.values()].map(p => norm(p[f])).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b)).map(x => `<option value="${esc(x)}">`).join("");
  return `<datalist id="dlMfr">${opts("manufacturer")}</datalist><datalist id="dlType">${opts("machineType")}</datalist><datalist id="dlMach">${opts("machine")}</datalist>`;
}

function receive(pnRaw, info = {}){
  const pn = norm(pnRaw).slice(0, 120);
  if (!pn && !info.thumb) return;
  const prev = parts.get(idFor(pn));
  pending = { info };
  closeCrop();
  $("#result").className = "result";
  const v = (a, b) => esc(a || b || "");
  const el = $("#review");
  el.innerHTML = `
    <div class="rv-top">
      ${info.thumb ? `<img src="${esc(info.thumb)}" alt="">` : ""}
      <div class="rv-stock" id="rvStock"></div>
    </div>
    <label>Part number<input id="rvPn" class="pnIn" value="${esc(pn)}" autocomplete="off"></label>
    ${info.others?.length ? `<div class="chips"><span>Other codes in the photo:</span>${info.others.map(o => `<button type="button" data-code="${esc(o)}">${esc(o)}</button>`).join("")}</div>` : ""}
    <label>Manufacturer<input id="rvMfr" list="dlMfr" value="${v(prev?.manufacturer, info.manufacturer)}"></label>
    <div class="two">
      <label>Machine type<input id="rvType" list="dlType" value="${v(prev?.machineType, info.machineType)}"></label>
      <label>Machine<input id="rvMach" list="dlMach" value="${v(prev?.machine, info.machine)}"></label>
    </div>
    <div class="two">
      <label>Description<input id="rvDesc" value="${v(prev?.description, info.description)}"></label>
      <label>Bin / location<input id="rvLoc" value="${v(prev?.location)}"></label>
    </div>
    ${datalists()}
    ${info.note ? `<p class="rv-hint">${esc(info.note)}</p>` : ""}
    <div class="stepper big">
      <label for="rvQty">Quantity</label>
      <button type="button" id="rvDown" aria-label="Less">−</button>
      <input id="rvQty" type="number" min="1" value="1" inputmode="numeric">
      <button type="button" id="rvUp" aria-label="More">+</button>
    </div>
    <p class="rv-hint hide" id="rvErr"></p>
    <div class="rv-act">
      <button type="button" class="recv" id="rvRecv">Receive</button>
      <button type="button" id="rvUse">Use</button>
    </div>
    <button type="button" class="rv-cancel" id="rvCancel">Cancel</button>`;
  el.classList.add("show");
  const qty = () => Math.max(1, parseInt($("#rvQty").value, 10) || 1);
  const fill = () => {
    const p = parts.get(idFor($("#rvPn").value));
    $("#rvStock").textContent = !norm($("#rvPn").value) ? "Enter the part number" : p ? `${p.qty || 0} on hand now` : "New part, not in inventory yet";
    if (p){
      [["#rvMfr","manufacturer"],["#rvType","machineType"],["#rvMach","machine"],["#rvDesc","description"],["#rvLoc","location"]]
        .forEach(([sel, f]) => { if (!$(sel).value) $(sel).value = p[f] || ""; });
    }
  };
  fill();
  $("#rvPn").oninput = fill;
  el.querySelectorAll("[data-code]").forEach(b => b.onclick = () => { $("#rvPn").value = b.dataset.code; fill(); });
  $("#rvUp").onclick = () => { $("#rvQty").value = qty() + 1; };
  $("#rvDown").onclick = () => { $("#rvQty").value = Math.max(1, qty() - 1); };
  $("#rvRecv").onclick = () => commit("receive", qty());
  $("#rvUse").onclick = () => commit("use", qty());
  $("#rvCancel").onclick = closeReview;
  el.scrollIntoView({ block: "nearest", behavior: "smooth" });
  if (!pn) $("#rvPn").focus();
}

function closeReview(){
  pending = null;
  $("#review").classList.remove("show");
  $("#review").innerHTML = "";
}

async function commit(kind, q){
  const info = pending?.info || {};
  const pn = norm($("#rvPn").value).slice(0, 120);
  const err = m => { const e = $("#rvErr"); e.textContent = m; e.classList.remove("hide"); };
  if (!pn) return err("Enter a part number.");
  if (kind === "use" && !parts.has(idFor(pn))) return err("This part isn’t in inventory yet. Receive it first.");
  const fields = { manufacturer: $("#rvMfr").value, machineType: $("#rvType").value, machine: $("#rvMach").value,
    description: $("#rvDesc").value, location: $("#rvLoc").value };
  const btn = $(kind === "use" ? "#rvUse" : "#rvRecv"), label = btn.textContent;
  $("#rvRecv").disabled = $("#rvUse").disabled = true;
  btn.textContent = "Saving…";
  try {
    const res = await apiPost({ action: "move", partNumber: pn, delta: kind === "use" ? -q : q, fields,
      thumb: info.thumb || "", how: kind === "use" ? "used" : (info.how || "typed") });
    parts.set(res.part.id, res.part);
    lastUndo = res.logId;
    closeReview();
    requestRender();
    const short = kind === "use" && res.before < q ? ` Only ${res.before} were on hand.` : "";
    showResult("ok", `${kind === "use" ? "Used" : "Received"} ${q} × ${res.part.partNumber}`, `${res.part.qty} on hand.${short}`, res.part.thumb, true);
  } catch (e) {
    $("#rvRecv").disabled = $("#rvUse").disabled = false;
    btn.textContent = label;
    err(e.server ? e.message : "Couldn’t save. Check your connection and try again.");
  }
}

async function undo(){
  if (!lastUndo) return;
  const id = lastUndo; lastUndo = null;
  showResult("busy", "Undoing…", "");
  try {
    await apiPost({ action: "undo", logId: id });
    await refresh();
    showResult("", "Undone.", "");
  } catch (e) {
    showResult("bad", "Couldn’t undo.", e.server ? e.message : "Adjust the quantity in the list instead.");
  }
}

/* ---------- photo scanning ---------- */
function loadImage(file){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error("bad image"));
    img.src = URL.createObjectURL(file);
  });
}
function toCanvas(img, max){
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c;
}
function thumbOf(img){
  const c = document.createElement("canvas"), n = 120;
  const side = Math.min(img.naturalWidth, img.naturalHeight);
  c.width = c.height = n;
  c.getContext("2d").drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, n, n);
  return c.toDataURL("image/jpeg", 0.6);
}
async function detectNative(canvas){
  if (!("BarcodeDetector" in window)) return [];
  try {
    const found = await new BarcodeDetector().detect(canvas);
    return found.map(b => ({ text: b.rawValue, format: b.format })).filter(b => b.text);
  } catch { return []; }
}
function detectZxing(canvas){
  if (!window.ZXing) return [];
  try {
    const hints = new Map(); hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    const reader = new ZXing.MultiFormatReader(); reader.setHints(hints);
    const bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(canvas)));
    const r = reader.decode(bmp);
    return r ? [{ text: r.getText(), format: String(ZXing.BarcodeFormat[r.getBarcodeFormat()] || "code").toLowerCase() }] : [];
  } catch { return []; }
}

/* ---------- label reading (free, on-device OCR) ---------- */
let ocrWorker = null;
function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = () => rej(new Error("script"));
    document.head.appendChild(s);
  });
}
async function getOcr(){
  if (!ocrWorker) ocrWorker = (async () => {
    if (!window.Tesseract) await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js");
    const w = await Tesseract.createWorker("eng");
    await w.setParameters({ tessedit_pageseg_mode: "6" });
    return w;
  })().catch(e => { ocrWorker = null; throw e; });
  return ocrWorker;
}
const PN_LABEL = /\b(?:MFG\.?\s*|MFR\.?\s*)?(?:P\s*\/\s*N|PN|PART\s*(?:NO|NUMBER|NUM|#)|MPN|MATERIAL(?:\s*(?:NO|NUMBER|#))?|MAT'?L|CAT(?:ALOG)?\.?\s*(?:NO|NUMBER|#)|ITEM\s*(?:NO|NUMBER|#)|MODEL\s*(?:NO|NUMBER|#)?|ORDER\s*CODE|TYPE)(?![A-Z])\.?\s*[:#.\-]?\s*([A-Z0-9][A-Z0-9\-\/.]{2,})/i;
const cleanTok = t => t.replace(/^[^A-Z0-9]+|[^A-Z0-9]+$/gi, "");
// Has a digit, no odd characters, not a date; all-digit values need 6+ digits
const looksLikePn = t => t.length >= 4 && t.length <= 40 && /\d/.test(t) && /^[A-Z0-9][A-Z0-9\-\/.]*$/i.test(t)
  && !/^\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}$/.test(t) && (/[A-Z]/i.test(t) || t.replace(/\D/g, "").length >= 6);
// lines: [{ text, words: [{ text, h }] }] from the OCR. Returns candidates, best first.
// O and I/l between or after digits are almost always misread 0 and 1
const fixDigits = t => t.replace(/(?<=\d)[Oo](?=\d)|(?<=\d\d)[Oo]$/g, "0").replace(/(?<=\d)[Il|](?=\d)|(?<=\d\d)[Il|]$/g, "1");
// A number the reader split at a gap: the next piece is the same print size and contains a digit
const continues = (a, b) => /\d/.test(b.t) && /^[A-Z0-9\-\/.]+$/i.test(b.t)
  && (!a.h || !b.h || Math.abs(a.h - b.h) <= 0.3 * Math.max(a.h, b.h));
// lines: [{ text, words: [{ text, h }] }] read from the box the user drew. Returns candidates, best first.
function partNumbersFrom(lines){
  const score = new Map();
  const add = (t, s) => { t = t.toUpperCase(); score.set(t, Math.max(score.get(t) || 0, s)); };
  const maxH = Math.max(1, ...lines.flatMap(l => (l.words || []).map(w => w.h || 0)));
  for (const line of lines){
    const text = norm(line.text);
    if (!text) continue;
    const m = text.match(PN_LABEL), labelled = m ? fixDigits(cleanTok(m[1])).toUpperCase() : "";
    const words = (line.words?.length ? line.words : text.split(/\s+/).map(t => ({ text: t })))
      .map(w => ({ t: fixDigits(cleanTok(w.text)), h: w.h || 0 })).filter(w => w.t);
    for (let i = 0; i < words.length; i++){
      // Try the word alone, then joined with following pieces
      let t = words[i].t;
      for (let j = i; j < words.length && j <= i + 6; j++){
        if (j > i){ if (!continues(words[j - 1], words[j])) break; t += words[j].t; }
        if (!looksLikePn(t)) continue;
        const letters = /[A-Z]/i.test(t), digits = t.replace(/\D/g, "").length;
        let s = (letters ? 100 : 0) + (digits >= 6 ? 50 : 0) + Math.min(t.length, 20) * 2 + 80 * words[i].h / maxH;
        if (labelled && t.toUpperCase().startsWith(labelled)) s += 1000;
        add(t, s);
      }
    }
  }
  return [...score].sort((a, b) => b[1] - a[1]).map(([t]) => t);
}
// Reading the red channel turns red or yellow highlighter stripes white, leaving the black print
function dropHighlights(canvas){
  const x = canvas.getContext("2d"), d = x.getImageData(0, 0, canvas.width, canvas.height), a = d.data;
  for (let i = 0; i < a.length; i += 4) a[i + 1] = a[i + 2] = a[i];
  x.putImageData(d, 0, 0);
  return canvas;
}
// Finds how far the text is tilted (at the right angle, dark pixels pile up into tight rows of text)
// and how tall the biggest row of text is, in canvas pixels
function textLayout(canvas){
  const k = Math.min(1, 700 / Math.max(canvas.width, canvas.height));
  const w = Math.round(canvas.width * k), h = Math.round(canvas.height * k);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  c.getContext("2d").drawImage(canvas, 0, 0, w, h);
  const a = c.getContext("2d").getImageData(0, 0, w, h).data;
  let sum = 0;
  for (let i = 0; i < a.length; i += 4) sum += a[i];
  const dark = (sum / (a.length / 4)) * 0.6, xs = [], ys = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (a[(y * w + x) * 4] < dark){ xs.push(x - w / 2); ys.push(y); }
  if (xs.length < 200) return { deg: 0, lineH: 0 };
  const profile = deg => {
    const t = Math.tan(deg * Math.PI / 180), rows = new Float64Array(h * 2 + 2);
    for (let i = 0; i < xs.length; i++){ const r = Math.round(ys[i] - xs[i] * t) + h; if (r >= 0 && r < rows.length) rows[r]++; }
    return rows;
  };
  let best = 0, bestScore = -1;
  for (let deg = -10; deg <= 10; deg += 0.5){
    const rows = profile(deg);
    let sc = 0;
    for (const v of rows) sc += v * v;
    if (sc > bestScore){ bestScore = sc; best = deg; }
  }
  // Tallest run of rows that hold a fair share of ink = height of the biggest text line
  const rows = profile(best), on = 0.2 * Math.max(...rows);
  let lineH = 0, run = 0;
  for (const v of rows){ run = v > on ? run + 1 : 0; lineH = Math.max(lineH, run); }
  return { deg: best, lineH: lineH / k };
}
function scaled(canvas, f){
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(canvas.width * f)); c.height = Math.max(1, Math.round(canvas.height * f));
  const x = c.getContext("2d");
  x.imageSmoothingQuality = "high";
  x.drawImage(canvas, 0, 0, c.width, c.height);
  return c;
}
function rotated(canvas, deg){
  const r = deg * Math.PI / 180, cos = Math.abs(Math.cos(r)), sin = Math.abs(Math.sin(r));
  const c = document.createElement("canvas");
  c.width = Math.round(canvas.width * cos + canvas.height * sin); c.height = Math.round(canvas.width * sin + canvas.height * cos);
  const x = c.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
  x.translate(c.width / 2, c.height / 2); x.rotate(-r);
  x.drawImage(canvas, -canvas.width / 2, -canvas.height / 2);
  return c;
}
async function readLabel(canvas){
  const worker = await getOcr();
  let c = dropHighlights(canvas);
  // The reader does best with letters about 40px tall, so resize to that, then straighten
  const { deg, lineH } = textLayout(c);
  const f = lineH ? Math.min(3, Math.max(0.25, 40 / lineH)) : 1;
  if (Math.abs(f - 1) > 0.15) c = scaled(c, f);
  if (Math.abs(deg) >= 1) c = rotated(c, deg);
  const { data } = await worker.recognize(c);
  return partNumbersFrom((data.lines || []).map(l => ({ text: l.text, words: (l.words || []).map(w => ({ text: w.text, h: w.bbox.y1 - w.bbox.y0 })) })));
}

// The boxed part of the full-size photo
function cropCanvas(img, box){
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(box.w)); c.height = Math.max(1, Math.round(box.h));
  c.getContext("2d").drawImage(img, box.x, box.y, box.w, box.h, 0, 0, c.width, c.height);
  return c;
}
function closeCrop(){
  $("#crop").classList.remove("show");
  $("#crop").innerHTML = "";
}
// No barcode: the user drags a box around the part number, and only that is read
function askForBox(img, thumb, why = "No barcode found."){
  getOcr().catch(() => {});
  $("#result").className = "result";
  const el = $("#crop");
  el.innerHTML = `
    <b>${esc(why)} Drag a box around the part number.</b>
    <div class="crop-stage" id="cropStage"><img src="${esc(img.src)}" alt="Photo of the part label"><div class="crop-box hide" id="cropBox"></div></div>
    <div class="rv-act">
      <button type="button" class="recv" id="cropRead" disabled>Read it</button>
      <button type="button" id="cropType">Type it</button>
    </div>
    <button type="button" class="rv-cancel" id="cropCancel">Cancel</button>`;
  el.classList.add("show");
  const stage = $("#cropStage");
  let box = null, start = null;
  const at = e => {
    const r = stage.getBoundingClientRect();
    return { x: Math.min(Math.max(e.clientX - r.left, 0), r.width), y: Math.min(Math.max(e.clientY - r.top, 0), r.height) };
  };
  const draw = () => {
    const b = $("#cropBox");
    b.classList.toggle("hide", !box);
    if (box) Object.assign(b.style, { left: box.x + "px", top: box.y + "px", width: box.w + "px", height: box.h + "px" });
    $("#cropRead").disabled = !box || box.w < 12 || box.h < 6;
  };
  stage.onpointerdown = e => { e.preventDefault(); stage.setPointerCapture(e.pointerId); start = at(e); box = null; draw(); };
  stage.onpointermove = e => {
    if (!start) return;
    const p = at(e);
    box = { x: Math.min(start.x, p.x), y: Math.min(start.y, p.y), w: Math.abs(p.x - start.x), h: Math.abs(p.y - start.y) };
    draw();
  };
  stage.onpointerup = stage.onpointercancel = () => { start = null; };
  $("#cropRead").onclick = async () => {
    const k = img.naturalWidth / stage.getBoundingClientRect().width;
    const sel = { x: box.x * k, y: box.y * k, w: box.w * k, h: box.h * k };
    closeCrop();
    showResult("busy", "Reading the part number…", ocrWorker ? "This takes a few seconds." : "The first read on this phone takes a little longer.", thumb);
    let found = [];
    try { found = await readLabel(cropCanvas(img, sel)); } catch {}
    if (!found.length){
      receive("", { thumb, how: "typed", note: "Couldn’t read a part number there. Type it, or take the photo again closer to the label." });
      return;
    }
    const pick = found.find(t => parts.has(idFor(t))) || found[0];
    receive(pick, { thumb, how: "label", others: found.filter(t => t !== pick).slice(0, 6),
      note: "Read from the label. Check the part number is right." });
  };
  $("#cropType").onclick = () => { closeCrop(); receive("", { thumb, how: "typed" }); };
  $("#cropCancel").onclick = closeCrop;
  el.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

async function processPhoto(file){
  $("#photo").disabled = true;
  closeCrop();
  try {
    let img;
    try { img = await loadImage(file); }
    catch { showResult("bad", "That file isn’t a photo this browser can open.", "Try taking the picture again."); return; }
    const thumb = thumbOf(img);
    showResult("busy", "Looking for a barcode…", "", thumb);
    const canvas = toCanvas(img, 1600);
    let codes = await detectNative(canvas);
    if (!codes.length) codes = detectZxing(canvas);
    codes = codes.map(c => ({ ...c, text: norm(c.text) })).filter((c, i, a) => c.text && a.findIndex(x => x.text === c.text) === i);
    // A part we already have: open it straight away
    const known = codes.find(c => parts.has(idFor(c.text)));
    if (known){ receive(known.text, { thumb, how: known.format, others: codes.filter(c => c !== known).map(c => c.text) }); return; }
    const fromCode = note => receive(codes[0].text, { thumb, how: codes[0].format, others: codes.slice(1).map(c => c.text), note });
    // Otherwise the sheet's script asks Gemini to read the label (and pick among any barcodes)
    showResult("busy", codes.length ? "New part. Reading the label…" : "No barcode found. Reading the label…", "This takes a few seconds.", thumb);
    let r;
    try {
      const image = canvas.toDataURL("image/jpeg", 0.85).split(",")[1];
      r = await apiPost({ action: "readLabel", image, codes: codes.map(c => c.text) });
    } catch (e) {
      if (codes.length) return fromCode("");
      return askForBox(img, thumb, e.server ? "Couldn’t read the label (" + e.message + ")." : "Couldn’t reach the label reader.");
    }
    const pn = norm(r.partNumber);
    if (!pn){
      if (codes.length) return fromCode("");
      return askForBox(img, thumb, "Couldn’t find a part number in that photo.");
    }
    receive(pn, { thumb, how: "label", others: codes.map(c => c.text).filter(t => idFor(t) !== idFor(pn)),
      description: r.description, manufacturer: r.manufacturer, machineType: r.machineType, machine: r.machine,
      note: r.confidence === "low" ? "Low confidence read. Double-check the part number." : "" });
  } finally {
    $("#photo").disabled = false;
  }
}

/* ---------- UI ---------- */
function showResult(kind, title, sub, thumb, withUndo){
  const el = $("#result");
  el.className = "result show " + (kind || "");
  el.innerHTML =
    (kind === "busy" ? '<div class="spinner" aria-hidden="true"></div>' : "") +
    (thumb ? `<img src="${esc(thumb)}" alt="">` : "") +
    `<div class="msg"><b>${esc(title)}</b>${sub ? `<div class="sub">${esc(sub)}</div>` : ""}</div>` +
    (withUndo ? '<button type="button" id="undoBtn">Undo</button>' : "");
  if (withUndo) $("#undoBtn").onclick = undo;
}
function fmtDate(iso){
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + ", " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}
function requestRender(){
  const a = document.activeElement;
  if (a && a.closest && a.closest(".detail") && a.tagName === "INPUT"){ pendingRender = true; return; }
  render();
}

function render(){
  pendingRender = false;
  const all = [...parts.entries()];
  const units = all.reduce((s, [, p]) => s + (p.qty || 0), 0);
  $("#totals").innerHTML = `<b>${all.length}</b> parts<br><b>${units}</b> units on hand`;

  const f = filter.toLowerCase();
  const shown = f ? all.filter(([, p]) => [p.partNumber, p.description, p.manufacturer, p.machineType, p.machine, p.location].join(" ").toLowerCase().includes(f)) : all;
  const list = $("#list");
  if (!all.length){ list.innerHTML = '<li class="empty">Nothing received yet. Scan your first part above.</li>'; return; }
  if (!shown.length){ list.innerHTML = `<li class="empty">No parts match “${esc(filter)}”.</li>`; return; }

  const sv = s => norm(s) ? "0" + norm(s).toLowerCase() : "1";
  const keyOf = p => [sv(p.manufacturer), sv(p.machineType), sv(p.machine), (p.partNumber || "").toLowerCase()];
  shown.sort((a, b) => { const ka = keyOf(a[1]), kb = keyOf(b[1]); for (let i = 0; i < 4; i++){ const c = ka[i].localeCompare(kb[i]); if (c) return c; } return 0; });
  let lastM = null, lastTM = null;
  list.innerHTML = shown.map(([id, p]) => {
    const m = norm(p.manufacturer) || "No manufacturer";
    const tm = [norm(p.machineType) || "No machine type", norm(p.machine)].filter(Boolean).join(", ");
    let head = "";
    if (m !== lastM){ head += `<li class="grp-m">${esc(m)}</li>`; lastM = m; lastTM = null; }
    if (tm !== lastTM){ head += `<li class="grp-t">${esc(tm)}</li>`; lastTM = tm; }
    const open = id === openId;
    const sub = [p.description, p.location ? "Bin " + p.location : ""].filter(Boolean).join(", ") || "Received " + fmtDate(p.lastReceived);
    return head + `<li data-id="${esc(id)}">
      <button class="row" type="button" aria-expanded="${open}">
        ${p.thumb ? `<img class="th" src="${esc(p.thumb)}" alt="">` : '<span class="th"></span>'}
        <span><div class="pn">${esc(p.partNumber)}</div><div class="desc">${esc(sub)}</div></span>
        <span class="qty">${p.qty || 0}<small>on hand</small></span>
      </button>
      ${open ? `<div class="detail">
        <label>Manufacturer<input data-f="manufacturer" value="${esc(p.manufacturer)}"></label>
        <div class="two">
          <label>Machine type<input data-f="machineType" value="${esc(p.machineType)}"></label>
          <label>Machine<input data-f="machine" value="${esc(p.machine)}"></label>
        </div>
        <div class="two">
          <label>Description<input data-f="description" value="${esc(p.description)}"></label>
          <label>Bin / location<input data-f="location" value="${esc(p.location)}"></label>
        </div>
        <div class="adj">
          <button type="button" data-adj="-1">Use 1</button>
          <button type="button" data-adj="1">Add 1</button>
          <button type="button" data-set>Set count</button>
          <button type="button" class="del" data-del>Delete part</button>
        </div>
        <div class="when">First received ${esc(fmtDate(p.firstReceived))}. Last received ${esc(fmtDate(p.lastReceived))}. Full history is on the Log tab of the sheet.</div>
      </div>` : ""}
    </li>`;
  }).join("");
}

async function act(body, okMsg){
  try {
    const res = await apiPost(body);
    if (res.deleted) parts.delete(res.deleted);
    if (res.part) parts.set(res.part.id, res.part);
    render();
    if (okMsg) showResult("ok", okMsg, "");
  } catch (e) {
    showResult("bad", "Couldn’t save that change.", e.server ? e.message : "Check your connection and try again.");
  }
}

$("#list").addEventListener("click", async e => {
  const li = e.target.closest("li[data-id]"); if (!li) return;
  const id = li.dataset.id; const p = parts.get(id); if (!p) return;
  if (e.target.closest(".row")){ openId = openId === id ? null : id; render(); return; }
  const adj = e.target.closest("[data-adj]");
  if (adj){
    const n = parseInt(adj.dataset.adj, 10);
    if (n < 0 && !(p.qty > 0)) return;
    adj.disabled = true;
    return act({ action: "move", partNumber: p.partNumber, delta: n, how: n > 0 ? "manual add" : "used" });
  }
  if (e.target.closest("[data-set]")){
    const v = prompt("Count on hand for " + p.partNumber, p.qty || 0);
    if (v === null) return;
    return act({ action: "set", id, qty: Math.max(0, parseInt(v, 10) || 0) });
  }
  const del = e.target.closest("[data-del]");
  if (del){
    if (del.dataset.armed){ openId = null; return act({ action: "delete", id }, "Deleted " + p.partNumber + "."); }
    del.dataset.armed = "1"; del.textContent = "Tap again to delete";
  }
});
$("#list").addEventListener("change", e => {
  const inp = e.target.closest("input[data-f]"); if (!inp) return;
  const id = inp.closest("li").dataset.id;
  act({ action: "update", id, fields: { [inp.dataset.f]: inp.value } });
});
$("#list").addEventListener("focusout", () => setTimeout(() => { if (pendingRender) requestRender(); }, 0));

$("#photo").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (f) processPhoto(f); };
$("#manualForm").onsubmit = e => {
  e.preventDefault();
  const v = $("#manualIn").value; $("#manualIn").value = "";
  receive(v, { how: "typed" });
};
$("#search").oninput = e => { filter = e.target.value.trim(); render(); };

$("#exportBtn").onclick = () => {
  const rows = [["Manufacturer","Machine type","Machine","Part number","Description","Location","On hand","First received","Last received"]];
  for (const [, p] of parts) rows.push([p.manufacturer, p.machineType, p.machine, p.partNumber, p.description, p.location, p.qty, p.firstReceived, p.lastReceived]);
  const csv = rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "inventory-" + new Date().toISOString().slice(0, 10) + ".csv";
  a.click();
};

/* ---------- setup, name, sharing ---------- */
$("#nameIn").value = LS.get("partsName");
$("#nameIn").onchange = () => LS.set("partsName", $("#nameIn").value.trim());

$("#shareBtn").onclick = async () => {
  const link = location.origin + location.pathname + (API_URL ? "" : "#api=" + encodeURIComponent(api));
  try { await navigator.clipboard.writeText(link); showResult("ok", "Link copied.", "Send it to anyone who should use the inventory. It connects them to the same sheet."); }
  catch { prompt("Copy this link and send it:", link); }
};
$("#changeApi").onclick = () => { $("#apiIn").value = api; $("#app").classList.add("hide"); $("#setup").classList.remove("hide"); };

$("#apiBtn").onclick = async () => {
  const url = $("#apiIn").value.trim();
  const errEl = $("#apiErr");
  const err = m => { errEl.textContent = m; errEl.classList.remove("hide"); };
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) return err("That doesn’t look like an Apps Script web app URL. It should start with https://script.google.com and end in /exec.");
  $("#apiBtn").disabled = true; $("#apiBtn").textContent = "Connecting…";
  try {
    await apiGet(url);
    api = url; LS.set("partsApi", url);
    errEl.classList.add("hide");
    start();
  } catch {
    err("Couldn’t reach that sheet. Check the deployment is set to Who has access: Anyone, then try again.");
  } finally {
    $("#apiBtn").disabled = false; $("#apiBtn").textContent = "Connect";
  }
};

let timer = null;
function start(){
  $("#setup").classList.add("hide");
  $("#app").classList.remove("hide");
  render();
  refresh();
  clearInterval(timer);
  timer = setInterval(() => { if (!document.hidden) refresh(); }, 20000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

if (api) start(); else $("#setup").classList.remove("hide");
</script>
